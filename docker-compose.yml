services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PLASMA_INSPECTOR_DB: /app/data/inspector.sqlite
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
